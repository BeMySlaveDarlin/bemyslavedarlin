[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping

[global]
error_log = /var/log/php-fpm.log
emergency_restart_threshold = 32
emergency_restart_interval = 1m
process_control_timeout = 10s
